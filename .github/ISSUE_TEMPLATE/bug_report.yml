name: Bug report
description: Something in Paradox is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Paradox version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: I enabled CrystalAura and ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash report or log
      render: shell
